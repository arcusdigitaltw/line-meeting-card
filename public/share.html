<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>分享到 LINE</title>
<meta property="og:title" content="分享到 LINE">
<meta property="og:description" content="在 LINE 開啟，選擇好友或群組即可傳送。">
<!-- LIFF SDK：一定要用 LINE 官方這個網址，不要自己下載一份放 -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--accent:#0EA5E9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#07070a;color:#e5e7eb;font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:24px;text-align:center}
  main{width:100%;max-width:380px}
  h1{font-size:22px;color:#fff;line-height:1.4}
  .when{margin-top:6px;font-size:14px;color:#9ca3af}
  .ring{width:120px;height:120px;margin:34px auto;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:var(--accent);animation:spin 1.1s linear infinite}
  .ring.stop{animation:none;border-color:var(--accent)}
  .ring.bad{animation:none;border-color:#ef4444}
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{font-size:15px;line-height:1.7;min-height:52px}
  button,a.btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:12px;border:0;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
  .primary{background:var(--accent);color:#04111a}
  .ghost{background:transparent;color:#e5e7eb;border:1px solid rgba(255,255,255,.2)}
  [hidden]{display:none!important}
  pre{margin-top:22px;text-align:left;font-size:11px;line-height:1.6;color:#6b7280;white-space:pre-wrap;word-break:break-all;border-left:2px solid rgba(255,255,255,.1);padding-left:10px}
</style>
</head>
<body>
<main>
  <h1 id="title">準備分享…</h1>
  <p class="when" id="when"></p>
  <div class="ring" id="ring"></div>
  <p id="status">載入中</p>
  <button class="primary" id="openLine" hidden>在 LINE 開啟分享</button>
  <button class="ghost" id="retry" hidden>再試一次</button>
  <a class="btn ghost" id="viewPage" hidden>查看會議資訊</a>
  <pre id="log"></pre>
</main>
<script>
/*
 * 這一頁就是 LIFF 的 Endpoint URL。流程只有五步：
 *   1. 從網址讀出要分享哪一張卡（?invite=代碼 或 ?summary=代碼）
 *   2. 跟後端要這張卡的 Flex Message 和 LIFF ID
 *   3. liff.init()
 *   4. 不在 LINE 裡 → 引導用 LINE 開啟；在 LINE 裡但沒登入 → liff.login()
 *   5. liff.shareTargetPicker() 跳出「選擇傳送對象」，傳完關閉視窗
 */
var $ = function (id) { return document.getElementById(id); };
function log(t) { $('log').textContent += '> ' + t + '\n'; }
function status(t, kind) { $('status').textContent = t; $('ring').className = 'ring' + (kind === 'ok' ? ' stop' : kind === 'bad' ? ' bad' : ''); }

/*
 * 雷點一：從 https://liff.line.me/<LIFF_ID>?invite=xxx 進來時，LINE 會先把參數包成 liff.state 再轉一次，
 * 所以 liff.init() 完成「之前」直接讀 location.search 會讀不到 invite。兩個地方都要找。
 */
function param(name) {
  var q = new URLSearchParams(location.search);
  if (q.get(name)) return q.get(name);
  var st = q.get('liff.state');
  if (!st) return null;
  try { return new URLSearchParams(st.replace(/^[^?]*\?/, '')).get(name); } catch (e) { return null; }
}

var kind = param('summary') ? 'summary' : 'invite';
var token = param(kind);

async function run() {
  $('retry').hidden = true; $('openLine').hidden = true;
  if (!token) { status('網址裡沒有指定要分享哪一場會議。', 'bad'); return; }
  try {
    status('讀取會議資料…');
    var res = await fetch('/api/card/' + kind + '/' + encodeURIComponent(token));
    var card = await res.json();
    if (!res.ok) throw new Error(card.error || '讀取失敗');
    document.documentElement.style.setProperty('--accent', card.accent || '#0EA5E9');
    $('title').textContent = card.title; $('when').textContent = card.when_label || '';
    $('viewPage').href = card.page_url; $('viewPage').hidden = false;
    log('card ok');

    if (!card.liff_id) { status('站長還沒設定 LIFF ID，暫時不能分享。', 'bad'); return; }

    status('連線到 LINE…');
    await liff.init({ liffId: card.liff_id });
    log('liff.init ok · inClient=' + liff.isInClient() + ' · os=' + liff.getOS());

    /* 一般瀏覽器（電腦、Safari、Chrome）沒有「選擇傳送對象」，請使用者改用 LINE 開 */
    if (!liff.isInClient()) {
      status('請用 LINE 開啟，才能選擇要傳給誰。', 'ok');
      $('openLine').hidden = false;
      $('openLine').onclick = function () { location.href = 'https://liff.line.me/' + card.liff_id + '?' + kind + '=' + encodeURIComponent(token); };
      return;
    }
    if (!liff.isLoggedIn()) { status('登入 LINE…'); liff.login(); return; }

    /* 雷點二：LIFF 後台沒把「Share target picker」打開，或 LINE 版本太舊，這裡會是 false */
    if (!liff.isApiAvailable('shareTargetPicker')) {
      status('這個 LIFF 還不能分享：請到 LINE Developers 把 LIFF 的「Share target picker」打開，或更新 LINE。', 'bad');
      return;
    }

    status('選擇要傳給誰');
    /* 雷點三：Flex 裡只要有一個 text 是空字串，這一行會「安靜地」失敗、什麼都不跳。後端的 findEmptyText 就是在防這個 */
    var result = await liff.shareTargetPicker([{ type: 'flex', altText: card.alt_text, contents: card.flex }]);
    if (result) { status('已傳送', 'ok'); log('shared'); setTimeout(function () { liff.closeWindow(); }, 700); }
    else { status('已取消分享。', 'ok'); $('retry').hidden = false; }
  } catch (e) {
    /* 把 LINE 回的錯誤代碼印出來，除錯全靠它（例如 INVALID_ARGUMENT 多半是 Flex 格式不對） */
    var msg = String(e && e.message ? e.message : e);
    /* 常見錯誤翻成白話，原文照樣印在下面的小字裡 */
    if (/channel not found/i.test(msg)) msg = 'LIFF ID 不正確（LINE 找不到這個 LIFF）。請到設定精靈的「綁定 LINE」檢查 LIFF ID。';
    else if (/endpoint/i.test(msg)) msg = '這一頁的網址和 LIFF 設定的 Endpoint URL 對不上。';
    status('分享沒有成功：' + msg, 'bad');
    log('error ' + (e && e.code ? e.code + ' ' : '') + (e && e.message ? e.message : e));
    $('retry').hidden = false;
  }
}
$('retry').onclick = run;
run();
</script>
</body>
</html>
